<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{img/school.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@600&family=Ubuntu+Mono:ital@1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <title>Agregar estudiante</title>
</head>
<body>
    <main class="principal d-flex flex-column justify-content-center align-items-center">
        <h1 class="text-center">Agregar nuevo estudiante</h1>

            <form th:action="@{/estudiantes/save}" th:object=${estudiante} method="post" class="formagregar border border-secondary p-5 mt-5 mb-5 w-50">
            
            <div class="mb-3 ">
                <input type="hidden" th:field="*{id}">
                <label for="cedula" class="form-label"><p>Número de documento</p></label>
                <input type="text" class="form-control border border-secondary" id="cedula" th:field="*{cedula}" required>
            </div>
            <div class="mb-3">
                <label for="apellidos" class="form-label"><p>Apellidos</p></label>
                <input type="text" class="form-control border border-secondary" id="apellidos" th:field="*{apellido}" required>
            </div>
            <div class="mb-3">
                <label for="nombre" class="form-label"><p>Nombres</p></label>
                <input type="text" class="form-control border border-secondary" id="nombre" th:field="*{nombre}" required>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label"><p>Correo electrónico</p></label>
                <input type="email" class="form-control border border-secondary" id="correo" th:field="*{correo}" required>
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label"><p>Número telefónico</p></label>
                <input type="text" class="form-control border border-secondary" id="telefono" th:field="*{telefono}" required>
            </div>
            <div class="mb-3">
                <label for="numeroRegistro" class="form-label"><p>Número de registro</p></label>
                <input type="text" class="form-control border border-secondary" id="numeroRegistro" th:field="*{numeroRegistro}" required>
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label"><p>Contraseña</p></label>
                <input type="password" class="form-control border border-secondary" id="contrasena" th:field="*{contrasena}">
            </div>
            <div class="mb-3">
                <label for="numeroRegistro" class="form-label"><p>Número de registro</p></label>
                <select class="form-select border border-secondary" aria-label="Default select example" th:field="*{estado}">
                    <option value="Realizado">Realizado</option>
                    <option value="Anulado">Anulado</option>
                </select>
            </div>
            <div class="mb-3 form-group">
                <label for="puntajeGlobal" class="form-label"><p>Puntaje global</p></label>
                <input type="number" min="0" max="300" step="0.1" class="form-control border border-secondary" id="puntajeGlobal" th:field="*{puntajeGlobal}" required>
            </div>
            <div class="mb-3">
                <label for="puntajeComunicacion" class="form-label"><p>Puntaje Comunicación escrita</p></label>
                <input type="number" min="0" max="300" step="0.1" class="form-control border border-secondary" id="puntajeComunicacion" th:field="*{puntajeComunicacion}" required>
            </div>
            <div class="mb-3">
                <label for="puntajeRazonamiento" class="form-label"><p>Puntaje Razonamiento Cuantitativo</p></label>
                <input type="number" min="0" max="300" step="0.1" class="form-control border border-secondary" id="puntajeRazonamiento" th:field="*{puntajeRazonamiento}" required>
            </div>
            <div class="mb-3">
                <label for="puntajeLectura" class="form-label"><p>Puntaje Lectura Crítica</p></label>
                <input type="number" min="0" max="300" step="0.1" class="form-control border border-secondary" id="puntajeLectura" th:field="*{puntajeLectura}" required>
            </div>
            <div class="mb-3">
                <label for="puntajeCiudadanas" class="form-label"><p>Puntaje Competencias Ciudadanas</p></label>
                <input type="number" min="0" max="300" step="0.1" class="form-control border border-secondary" id="puntajeCiudadanas" th:field="*{puntajeCiudadanas}" required>
            </div>
            <div class="mb-3">
                <label for="puntajeIngles" class="form-label"><p>Puntaje Inglés</p></label>
                <input type="number" min="0" max="300" step="0.1" class="form-control border border-secondary" id="puntajeIngles" th:field="*{puntajeIngles}" required>
            </div>
            <div class="mb-3">
                <label for="puntajeFormulacion" class="form-label"><p>Puntaje Formulación De Proyectos De Ingeniería</p></label>
                <input type="number" min="0" max="300" step="0.1" class="form-control border border-secondary" id="puntajeFormulacion" th:field="*{puntajeFormulacion}" required>
            </div>
            <div class="mb-3">
                <label for="puntajePensamiento" class="form-label"><p>Puntaje Pensamiento Científico -Matemáticas Y Estadística</p></label>
                <input type="number" min="0" max="300" step="0.1" class="form-control border border-secondary" id="puntajePensamiento" th:field="*{puntajePensamiento}" required>
            </div>
            <div class="mb-3">
                <label for="puntajeDiseno" class="form-label"><p>Puntaje Diseño De Software</p></label>
                <input type="number" min="0" max="300" step="0.1" class="form-control border border-secondary" id="puntajeDiseno" th:field="*{puntajeDiseno}" required>
            </div>
            <div class="mb-3">
                <label for="nivelIngles" class="form-label"><p>Nivel de inglés</p></label>
                <input type="text" class="form-control border border-secondary" id="nivelIngles" th:field="*{nivelIngles}" required>
            </div>
            <center><button type="submit" class="botonsubmit btn mt-3" style="width: 100%;">Registrar</button></center>            
            </form>

        <a type="button" th:href="@{/estudiantes/}" class="boton btn" style="width: 200px; height: 50px;"><p>Regresar</p></a>

    </main>

    <footer class="d-flex flex-column justify-content-center align-items-center">
        <p class="text-center">Derechos Reservados - Jhon Diego López Morales</p>
    </footer>

</body>
</html>
