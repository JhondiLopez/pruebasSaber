<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{img/school.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@600&family=Ubuntu+Mono:ital@1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <main class="principal d-flex flex-column justify-content-center align-items-center">
        <h1 class="text-center">Inicio de sesión Estudiante</h1>

            <form th:action="@{/loginEstudiante}" method="post" class=" formlogin border border-secondary p-5 mt-5 mb-5">
            
            <div class="mb-3 ">
                <label for="usuario" class="form-label"><p>Cédula</p></label>
                <input type="text" class="form-control border border-secondary" id="cedula" name="cedula">
            </div>
            <div class="mb-5">
                <label for="contrasena" class="form-label"><p>Contraseña</p></label>
                <input type="password" class="form-control border border-secondary" id="contrasena" name="contrasena">
            </div>
            <center><button type="submit" class="botonsubmit btn mt-3" style="width: 100%;">Iniciar sesión</button></center>
            </form>

            <a type="button" th:href="@{/index}" class=" boton btn" style="width: 200px; height: 50px;"><p>Regresar</p></a>
    </main>
    
    <footer class="d-flex flex-column justify-content-center align-items-center">
        <p class="text-center">Derechos Reservados - Jhon Diego López Morales</p>
    </footer>

</body>
</html>
